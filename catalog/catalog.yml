#
# What the catalog at /catalog/ publishes (.github/workflows/pages.yml). Every release of each
# repository listed here contributes its package (<id>-<version>.zip, already signed by the plugin
# workflow of the organization).

# Version of the plugin API whose PackageSigningTool signs the index.
mosaikit-version: 0.1.0-SNAPSHOT

# Name of the publisher key of the catalog: the public key is signing/<name>.pub.pem, the private
# key the secret CATALOG_SIGNING_KEY.
publisher-key: mosaikit

# Repositories of the plugins, as owner/name. Prereleases are left out.
plugins: []
#  - mosaikit/app-data
#  - mosaikit/app-maps
#  - mosaikit/app-dashboards
#  - mosaikit/app-processes
