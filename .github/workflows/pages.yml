#
# Publishes https://mosaikit.github.io/ on GitHub Pages (ADR-0025 of mosaikit/mosaikit): the pages
# of the site, the JSON schemas, and at /catalog/ the signed catalog of ADR-0021, built from the
# releases of the plugins listed in catalog/catalog.yml.
#
# Secrets: CATALOG_SIGNING_KEY, the private key (PEM) of the publisher of the catalog; CATALOG_TOKEN,
# a token that reads the releases of the plugin repositories (needed while they are private).
# Without CATALOG_SIGNING_KEY the site is published without the catalog.

name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Site
        run: |
          mkdir -p _site
          cp -r index.html 404.html assets marketplace schemas _site/

      - name: Read catalog.yml
        id: config
        env:
          PRIVATE_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          {
            echo "version=$(yq -r '."mosaikit-version"' catalog/catalog.yml)"
            echo "key=$(yq -r '."publisher-key"' catalog/catalog.yml)"
            if [[ -n "$PRIVATE_KEY" ]]; then echo "sign=true"; else echo "sign=false"; fi
          } >> "$GITHUB_OUTPUT"
      - name: No catalog
        if: steps.config.outputs.sign != 'true'
        run: |
          echo "::warning::the secret CATALOG_SIGNING_KEY is not set: the site is published without /catalog/"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.config.outputs.sign == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - name: Plugin API
        if: steps.config.outputs.sign == 'true'
        id: api
        uses: mosaikit/.github/actions/kernel-api@main
        with:
          version: ${{ steps.config.outputs.version }}

      - name: Download the packages
        if: steps.config.outputs.sign == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATALOG_TOKEN || github.token }}
        run: |
          mkdir -p _site/catalog
          for repo in $(yq -r '.plugins[]' catalog/catalog.yml); do
            for tag in $(gh release list --repo "$repo" --exclude-pre-releases --exclude-drafts \
                --limit 100 --json tagName --jq '.[].tagName'); do
              gh release download "$tag" --repo "$repo" --dir _site/catalog --pattern '*.zip' --skip-existing
            done
          done
          ls -l _site/catalog

      - name: Sign the index
        if: steps.config.outputs.sign == 'true'
        env:
          KEY_NAME: ${{ steps.config.outputs.key }}
          PRIVATE_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          JAR: ${{ steps.api.outputs.jar }}
        run: |
          signing=catalog/signing; out=_site/catalog
          [[ -f "$signing/$KEY_NAME.pub.pem" ]] || { echo "::error::$signing/$KEY_NAME.pub.pem is missing"; exit 1; }
          keys="$RUNNER_TEMP/keys"; trusted="$RUNNER_TEMP/trusted"; mkdir -p "$keys" "$trusted"
          cp "$signing/$KEY_NAME.pub.pem" "$keys/"; cp "$signing"/*.pub.pem "$trusted/"
          printf '%s\n' "$PRIVATE_KEY" > "$keys/$KEY_NAME.key.pem"
          tool=(java -cp "$JAR" dev.mosaikit.kernel.api.signature.PackageSigningTool)
          if compgen -G "$out/*.zip" > /dev/null; then "${tool[@]}" verify "$trusted" "$out"/*.zip; fi
          "${tool[@]}" index "$keys/$KEY_NAME" "$out"
          rm -f "$keys/$KEY_NAME.key.pem"
          cp "$signing"/*.pub.pem "$out/"
          (cd "$out" && for f in *.zip; do [[ -f "$f" ]] && sha256sum "$f" > "$f.sha256"; done; true)

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
